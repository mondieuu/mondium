<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' file:; style-src 'unsafe-inline'; img-src https: http: data: crx: chrome-extension:">
<script src="i18n.js"></script>
<title>Mondium</title>
<style>
  :root {
    --frame:#dfe3e7; --toolbar:#ffffff; --omni:#edf2fa; --omni-hover:#e2e7ef; --text:#1f1f1f; --dim:#474747;
    --hover:rgba(31,31,31,.08); --press:rgba(31,31,31,.14); --tab-hover:#e9ecef; --sep:#a8abaf; --accent:#0b57d0;
    --border:#c7c7c7; --shadow:0 1px 6px rgba(32,33,36,.28); --ok:#146c2e; --badge:#0b57d0; --badge-fg:#fff; --menu:#ffffff; --sel:#d3e3fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --frame:#1f1f1f; --toolbar:#3c3c3c; --omni:#282828; --omni-hover:#2f2f2f; --text:#e3e3e3; --dim:#c7c7c7;
      --hover:rgba(227,227,227,.10); --press:rgba(227,227,227,.16); --tab-hover:#2a2a2a; --sep:#5f6368; --accent:#a8c7fa;
      --border:#5f6368; --shadow:0 1px 6px rgba(0,0,0,.6); --ok:#6dd58c; --badge:#a8c7fa; --badge-fg:#062e6f; --menu:#2d2f31; --sel:#004a77;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:transparent; color:var(--text);
    font:12px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; user-select:none; -webkit-user-select:none; cursor:default; }
  button { font:inherit; color:inherit; border:0; background:none; }
  svg { width:20px; height:20px; fill:currentColor; display:block; }

  /* ---------- Tab strip ---------- */
  #strip { height:42px; background:var(--frame); display:flex; align-items:flex-end; padding:0 8px; -webkit-app-region:drag; }
  /* Room for the macOS window buttons, which hide in fullscreen */
  body.mac:not(.fs) #strip { padding-left:80px; }
  body.vert.mac:not(.fs) #toolbar { padding-left:80px; }
  body.overlay #strip { padding-right:146px; }
  #tabs { display:flex; align-items:flex-end; min-width:0; flex:0 1 auto; height:100%; }
  .tab { position:relative; flex:0 1 auto; width:240px; min-width:44px; height:34px; display:flex; align-items:center;
    padding:0 8px 0 12px; gap:8px; color:var(--dim); -webkit-app-region:no-drag; z-index:1; }
  .tab::before { content:""; position:absolute; inset:4px 2px 4px 2px; border-radius:8px; z-index:-1; }
  .tab:hover:not(.on)::before { background:var(--tab-hover); }
  .tab::after { content:""; position:absolute; left:0; top:10px; width:1px; height:16px; background:var(--sep); }
  .tab:first-child::after, .tab.on::after, .tab:hover::after, .tab.on + .tab::after, .tab:hover + .tab::after { display:none; }
  .tab.on { background:var(--active-tab, var(--toolbar)); color:var(--text); border-radius:10px 10px 0 0; z-index:2; }
  .tab.on .c1, .tab.on .c2 { position:absolute; bottom:0; width:10px; height:10px; display:block; }
  .tab .c1, .tab .c2 { display:none; }
  .tab.on .c1 { left:-10px; background:radial-gradient(circle at 0 0, transparent 10px, var(--toolbar) 10.5px); }
  .tab.on .c2 { right:-10px; background:radial-gradient(circle at 100% 0, transparent 10px, var(--toolbar) 10.5px); }
  .tab .ico { width:16px; height:16px; flex:none; display:flex; align-items:center; justify-content:center; }
  .tab .ico img { width:16px; height:16px; }
  .tab .ico svg { width:16px; height:16px; }
  .tab .title { flex:1; min-width:0; overflow:hidden; white-space:nowrap;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); }
  .tab.sleep .title, .tab.sleep .ico { opacity:.55; }
  .tab .aud { width:16px; height:16px; flex:none; opacity:.8; }
  .tab .aud svg { width:16px; height:16px; }
  .tab .x { width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .tab .x svg { width:14px; height:14px; }
  .tab .x:hover { background:var(--hover); }
  .tab .x:active { background:var(--press); }
  .tab.narrow { padding:0; justify-content:center; }
  .tab.narrow .title, .tab.narrow .aud { display:none; }
  .tab.narrow:not(.on) .x { display:none; }
  .tab.narrow.on .ico { display:none; }
  .tab.drag { opacity:.85; z-index:5; }
  /* Pinned tab: icon only */
  .tab.pin { width:44px; flex:none; padding:0; justify-content:center; gap:2px; }
  .tab.pin .title, .tab.pin .x { display:none; }
  .tab.pin .aud { position:absolute; right:3px; top:6px; width:14px; height:14px; border-radius:50%; background:var(--frame); }
  .tab.pin.on .aud { background:var(--toolbar); }
  .tab.pin .aud svg { width:12px; height:12px; margin:1px; }
  .tab .aud { border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .tab .aud:hover { background:var(--hover); opacity:1; }
  .tab .aud.boost { color:var(--accent); fill:var(--accent); opacity:1; }

  /* ---------- Vertical tabs (sidebar on the left) ---------- */
  #side { display:none; }
  body.vert { display:flex; flex-direction:column; }
  body.vert #strip { display:none; }
  body.vert #toolbar { -webkit-app-region:drag; flex:none; }
  body.vert #toolbar > * { -webkit-app-region:no-drag; }
  body.vert.overlay #toolbar { padding-right:146px; }
  body.vert #bbar, body.vert #find { flex:none; }
  body.vert #side { display:flex; flex-direction:column; flex:1; min-height:0; width:var(--sw, 240px); background:var(--frame); position:absolute; left:0; top:var(--top, 46px); bottom:0; transition:transform .18s ease; transform:translateX(0); }
  /* Auto-hide mode: sidebar hidden on the left, slides over the page at the same width when opened */
  body.vert.autohide #side { transform:translateX(-102%);
    box-shadow:6px 0 18px rgba(0,0,0,.28); z-index:60; border-radius:0 10px 10px 0; }
  body.vert.autohide.reveal #side { transform:none; }
  #sidehead { flex:none; display:flex; align-items:center; gap:2px; padding:8px 6px 6px; }
  #snew { flex:1; min-width:0; height:34px; border-radius:8px; display:flex; align-items:center; gap:10px; padding:0 10px; color:var(--text); white-space:nowrap; overflow:hidden; }
  #snew svg { width:18px; height:18px; flex:none; color:var(--dim); }
  #snew:hover, #shide:hover { background:var(--tab-hover); }
  #shide { width:34px; height:34px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  #shide svg { width:18px; height:18px; }
  body.vert #side #incog { margin:0 0 0 2px; }
  /* Drag the window from empty space (below tabs, top gap); tabs/buttons stay clickable */
  body.vert #side { -webkit-app-region:drag; }
  body.vert.autohide:not(.reveal) #side { -webkit-app-region:no-drag; }
  body.vert #side .tab, body.vert #snew, body.vert #shide, body.vert #grip, body.vert #side #incog { -webkit-app-region:no-drag; }
  #sidetitle { flex:1; }
  #sidespace { flex:1; min-height:8px; }
  #sidefoot { flex:none; padding:4px 6px 8px; display:flex; }
  /* Grid of pinned tabs at the top of the vertical sidebar */
  #pinnedtabs { display:none; }
  body.vert #pinnedtabs:not(:empty) { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:2px 8px 12px; max-height:45%; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; overscroll-behavior:contain; flex:0 0 auto; align-content:start; -webkit-app-region:no-drag; }
  body.vert #pinnedtabs .tab { width:100%; min-width:0; height:48px; padding:0; justify-content:center; border-radius:8px; background:var(--active-tab,var(--omni)); }
  body.vert #pinnedtabs .tab.on { background:var(--omni-hover); box-shadow:inset 0 0 0 1px var(--tab-accent,#808080); }
  body.vert #pinnedtabs .tab:hover { background:var(--tab-hover); }
  body.vert #pinnedtabs .title, body.vert #pinnedtabs .x, body.vert #pinnedtabs .c1, body.vert #pinnedtabs .c2 { display:none; }
  body.vert.slim #pinnedtabs:not(:empty) { grid-template-columns:1fr; gap:6px; padding:2px 6px 8px; }
  body.vert #pinnedtabs .ico { opacity:1; }
  .tab.sleep .ico, body.vert #pinnedtabs .tab.sleep .ico { opacity:.45; filter:grayscale(1); }
  body.vert #pinnedtabs::-webkit-scrollbar { display:none; }
  body.vert #pinnedtabs .tab.placeholder { opacity:1; background:var(--omni-hover); box-shadow:inset 0 0 0 1px var(--tab-accent,#808080); }
  body.vert #pinnedtabs .tab.placeholder .ico { opacity:1; filter:none; }
  body.vert.slim #pinnedtabs .tab { height:36px; }
  body.vert.slim #pinnedtabs:not(:empty) { gap:2px; }
  #pinnedSeparator { display:none; }
  body.vert #pinnedtabs:not(:empty) + #pinnedSeparator { display:block; flex:none; height:1px; margin:4px 8px 10px; background:color-mix(in srgb,var(--border) 35%,transparent); }
  body.vert #side { overflow:hidden; }
  body.vert #vtabs { position:relative; isolation:isolate; }
  .pinned-ghost { position:fixed; z-index:140; pointer-events:none; display:flex; align-items:center; justify-content:center; padding:0; border-radius:8px; background:var(--omni-hover); box-shadow:inset 0 0 0 1px var(--tab-accent,#808080),0 8px 22px rgba(0,0,0,.4); }
  .pinned-ghost .ico { opacity:1; filter:none; }
  .pinned-ghost .title, .pinned-ghost .x, .pinned-ghost .c1, .pinned-ghost .c2 { display:none; }
  /* Optional search/address box shown before a new tab opens */
  #newtabPrompt { position:fixed; inset:0; z-index:110; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.38); }
  #newtabPrompt[hidden] { display:none; }
  #newtabPrompt form { position:absolute; left:50%; top:max(16px,calc(35% - 33px)); transform:translateX(-50%); display:flex; flex-direction:column; align-items:stretch; gap:0; width:min(750px,calc(100vw - 64px)); padding:20px; background:var(--menu); border:1px solid var(--border); border-radius:10px; box-shadow:0 16px 80px rgba(0,0,0,.35); }
  .newtab-row { display:flex; align-items:center; gap:16px; height:24px; }
  #newtabSearchIcon { display:flex; align-items:center; flex:none; }
  #newtabSearchIcon svg { width:18px; height:18px; }
  #newtabQuery { width:100%; height:24px; line-height:24px; padding:0; border:0; outline:0; background:none; color:var(--text); font:14px/24px "Segoe UI",sans-serif; }
  #newtabResults:empty { display:none; }
  #newtabResults { margin:14px -12px -12px; max-height:min(340px,calc(65vh - 64px)); overflow:auto; }
  #newtabResults button { display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:8px 12px; text-align:left; border-radius:6px; }
  #newtabResults button.sel, #newtabResults button:hover { background:var(--hover); }
  #newtabResults img, #newtabResults svg { width:18px; height:18px; flex:none; }
  #newtabResults .result-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #newtabResults small { display:block; color:var(--dim); overflow:hidden; text-overflow:ellipsis; }
  #vtabs { flex:0 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 6px 8px; display:flex; flex-direction:column; gap:2px; scrollbar-width:thin; }
  body.vert .tab { width:auto; min-width:0; height:36px; flex:none; border-radius:8px; padding:0 4px 0 10px; gap:10px; }
  body.vert .tab::before, body.vert .tab::after, body.vert .tab .c1, body.vert .tab .c2 { display:none !important; }
  body.vert .tab:hover:not(.on) { background:var(--tab-hover); }
  body.vert .tab.on { background:var(--active-tab, var(--toolbar)); color:var(--text); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  body.vert .tab.pin { width:auto; padding:0 4px 0 10px; justify-content:flex-start; gap:10px; }
  body.vert .tab.pin .title { display:block; }
  body.vert .tab.pin .aud { position:static; background:none; width:16px; height:16px; }
  body.vert .tab .x { opacity:0; }
  body.vert .tab:hover .x, body.vert .tab.on .x { opacity:1; }
  /* Narrowest state: icons only */
  body.vert.slim #snew span, body.vert.slim #shide, body.vert.slim #side #incog { display:none; }
  body.vert.slim #snew { justify-content:center; padding:0; }
  body.vert.slim .tab { justify-content:center; padding:0; gap:0; }
  body.vert.slim .tab .title, body.vert.slim .tab .x, body.vert.slim .tab .aud { display:none; }
  #grip { position:absolute; top:0; bottom:0; right:-4px; width:8px; cursor:ew-resize; z-index:5; }
  #grip::after { content:""; position:absolute; top:0; bottom:0; left:3px; width:2px; border-radius:1px; background:transparent; transition:background .1s; }
  #grip:hover::after, body.sizing #grip::after { background:var(--accent); }
  body.vert.autohide #grip { display:none; }
  body.sizing, body.sizing * { cursor:ew-resize !important; }

  /* ---------- Address bar suggestions ---------- */
  #sug { position:fixed; z-index:90; background:var(--toolbar); border-radius:0 0 18px 18px; padding:4px 0 10px;
    box-shadow:0 6px 12px rgba(0,0,0,.18); font:14px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  #sug[hidden] { display:none; }
  #sug .sr { height:36px; display:flex; align-items:center; gap:12px; padding:0 16px 0 14px; cursor:default; white-space:nowrap; }
  #sug .sr:hover { background:var(--hover); }
  #sug .sr.sel { background:var(--sel); }
  #sug .sr .si { width:16px; height:16px; flex:none; color:var(--dim); display:flex; align-items:center; justify-content:center; }
  #sug .sr .si svg, #sug .sr .si img { width:16px; height:16px; }
  #sug .sr .st { overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0; }
  #sug .sr .su { color:var(--accent); overflow:hidden; text-overflow:ellipsis; flex:1 1 0; min-width:60px; font-size:13px; }
  #sug .sr .su::before { content:"–"; color:var(--dim); margin-right:8px; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid transparent; border-top-color:var(--accent);
    border-right-color:var(--accent); animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #newtab { flex:none; width:28px; height:28px; margin:0 0 3px 6px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; color:var(--dim); -webkit-app-region:no-drag; }
  #newtab:hover { background:var(--hover); }
  #newtab:active { background:var(--press); }

  /* ---------- Toolbar ---------- */
  #toolbar { height:46px; background:var(--toolbar); border-bottom:1px solid transparent; display:flex; align-items:center; gap:2px; padding:0 6px; }
  .btn { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none; position:relative; }
  .btn:hover:not(:disabled) { background:var(--hover); }
  .btn:active:not(:disabled) { background:var(--press); }
  .btn:disabled { opacity:.38; }
  #omni { flex:1; height:36px; margin:0 6px; border-radius:18px; background:var(--omni); display:flex; align-items:center; min-width:0; }
  #omni:hover { background:var(--omni-hover); }
  #omni.focus { background:var(--toolbar); box-shadow:var(--shadow); }
  #omni .lead { width:28px; height:28px; margin-left:4px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none; }
  #omni .lead svg { width:16px; height:16px; }
  #omni .lead:hover { background:var(--hover); }
  #url { flex:1; height:100%; border:0; outline:none; background:none; color:var(--text); font:14px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding:0 14px 0 6px; min-width:0; user-select:text; -webkit-user-select:text; cursor:text; }
  #url::placeholder { color:var(--dim); }
  #url::selection { background:var(--accent); color:var(--toolbar); }
  #shield .badge { position:absolute; right:1px; bottom:3px; min-width:15px; height:13px; padding:0 3px; border-radius:7px;
    background:var(--badge); color:var(--badge-fg); font-size:9px; font-weight:700; line-height:13px; text-align:center; }
  #shield.ok { color:var(--ok); }
  #dl { display:none; }
  #dl.show { display:flex; }
  #dl .ring { position:absolute; inset:5px; border-radius:50%; pointer-events:none;
    -webkit-mask:radial-gradient(circle, transparent 10.5px, #000 11px); }
  #toolbar .sepv { width:1px; height:20px; background:var(--border); margin:0 4px; opacity:.6; }

  #star { width:28px; height:28px; margin-right:4px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none; }
  #star svg { width:18px; height:18px; }
  #star:hover { background:var(--hover); }
  #star.on { color:var(--accent); }
  #star[hidden] { display:none; }
  /* Volume boost button (inside the address bar, left of the star) */
  #vol { width:28px; height:28px; margin-right:4px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none; position:relative; }
  #vol svg { width:18px; height:18px; }
  #vol:hover { background:var(--hover); }
  #vol.on { color:var(--accent); }
  #vol:disabled { opacity:.35; }
  #vol:disabled:hover { background:none; }
  #vol .vb { position:absolute; right:-2px; bottom:0; font-size:8px; font-weight:700; line-height:10px; padding:0 2px; border-radius:5px; background:var(--accent); color:var(--toolbar); }
  /* Volume bubble: top row (icon, title, value), slider + scale, bottom bar */
  .panel.vp { width:340px; padding:0; overflow:hidden; white-space:normal; }
  .vp .vh { display:flex; align-items:center; gap:12px; padding:16px 20px 4px; }
  .vp .vh svg { width:22px; height:22px; color:var(--accent); flex:none; }
  .vp .vt { flex:1; min-width:0; font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vp .vv { flex:none; font-size:22px; font-weight:500; font-variant-numeric:tabular-nums; }
  .vp .vr { padding:10px 20px 2px; }
  .vp input[type=range] { display:block; width:100%; height:20px; margin:0; accent-color:var(--accent); outline:none; }
  .vp .vs { position:relative; height:16px; margin:4px 0 0; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  /* Scale labels sit on the slider track (inset by the thumb width) */
  .vp .vs span { position:absolute; top:0; transform:translateX(-50%); white-space:nowrap; }
  .vp .vq { display:flex; gap:6px; padding:10px 20px 14px; }
  .vp .vq button { flex:1; height:28px; border-radius:14px; border:1px solid var(--border); color:var(--text); font-size:12px; font-variant-numeric:tabular-nums; }
  .vp .vq button:hover { background:var(--hover); }
  .vp .vq button.on { background:var(--sel); border-color:transparent; color:var(--accent); font-weight:600; }
  .vp .vf { display:flex; align-items:center; gap:12px; padding:10px 14px 10px 20px; border-top:1px solid var(--border); color:var(--dim); font-size:12px; }
  .vp .vf span { flex:1; min-width:0; }
  .vp .vf button { flex:none; height:32px; padding:0 14px; border-radius:16px; border:1px solid var(--border); color:var(--accent); font-weight:500; white-space:nowrap; }
  .vp .vf button:hover { background:var(--hover); }
  /* Incognito badge (right side of the tab strip) */
  #incog { flex:none; display:flex; align-items:center; gap:6px; height:28px; margin:0 6px 4px auto; padding:0 10px; border-radius:14px; color:#e3e3e3; font-size:12px; -webkit-app-region:no-drag; }
  #incog svg { width:18px; height:18px; }
  #incog[hidden] { display:none; }
  /* Extensions panel (puzzle) */
  .panel.xp { width:320px; }
  .xp .xt { padding:6px 16px 10px; font-size:14px; font-weight:500; }
  .xp .mi { height:40px; }
  .xp .mi .ic img { width:20px; height:20px; border-radius:3px; }
  .xp .pin { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none; }
  .xp .pin svg { width:16px; height:16px; }
  .xp .pin.on { color:var(--accent); }
  .xp .pin:hover { background:var(--hover); }

  /* ---------- Bookmarks bar ---------- */
  #bbar { height:32px; background:var(--toolbar); display:none; align-items:center; gap:2px; padding:0 8px 2px; overflow:hidden; border-bottom:1px solid var(--border); }
  body.bbar #bbar { display:flex; }
  .bm { height:28px; max-width:170px; display:flex; align-items:center; gap:6px; padding:0 8px; border-radius:14px; color:var(--text); flex:none; }
  .bm:hover { background:var(--hover); }
  .bm:active { background:var(--press); }
  .bm img, .bm svg { width:16px; height:16px; flex:none; }
  .bm.folder svg { fill:currentColor; color:var(--dim); }
  .bm span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #bbar .hintx { color:var(--dim); padding:0 6px; white-space:nowrap; }

  /* ---------- Extension icons ---------- */
  #actions { display:flex; align-items:center; }
  browser-action-list { display:flex; align-items:center; gap:2px; }
  browser-action-list::part(action) { width:34px; height:34px; border-radius:50%; background-size:18px; background-position:center; background-repeat:no-repeat; }
  browser-action-list::part(action):hover { background-color:var(--hover); }
  browser-action-list::part(badge) { font-size:9px; border-radius:7px; padding:0 3px; bottom:4px; right:2px; }
  #ext[hidden] { display:none; }

  /* ---------- Chrome-style menu ---------- */
  #pop { position:fixed; inset:0; z-index:100; }
  #pop[hidden] { display:none; }
  .panel { position:absolute; width:316px; max-height:calc(100vh - 60px); overflow-y:auto; overflow-x:hidden;

      const u = document.createElement('span'); u.className = 'su';

function menuAct(id, arg, keep) {
  if (!id) return;
  if (!keep) closeMenu();
  send('menu-action', { id, arg });
}

function closeMenu() {
  if (!menu && !chooser) return;
  menu = null;
  chooser = null;
  clearTimeout(subTimer);
  pop.hidden = true;
  pop.replaceChildren();
  send('menu-close');
}

function buildPanel(items, isSub) {
  const panel = document.createElement('div');
  panel.className = 'panel' + (isSub ? ' sub' : '');
  for (const it of items) {
    if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; panel.appendChild(s); continue; }
    if (it.header) { const h = document.createElement('div'); h.className = 'hd'; h.textContent = it.header; panel.appendChild(h); continue; }
    if (it.empty) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = it.empty; panel.appendChild(e); continue; }
    if (it.zoom) { panel.appendChild(zoomRow()); continue; }
    const row = document.createElement('div');
    row.className = 'mi' + (it.dis ? ' dis' : '');
    const ic = document.createElement('span'); ic.className = 'ic';
    if (it.img) { const im = document.createElement('img'); im.src = it.img; im.alt = ''; im.onerror = () => { ic.innerHTML = it.icon || ''; }; ic.appendChild(im); }
    else ic.innerHTML = it.icon || '';
    const lb = document.createElement('span'); lb.className = 'lb'; lb.textContent = it.label;
    row.append(ic, lb);
    if (it.accel) { const a = document.createElement('span'); a.className = 'ac'; a.textContent = it.accel; row.appendChild(a); }
    if (it.trail) {
      const b = document.createElement('button'); b.className = 'tb'; b.textContent = it.trail.label;
      b.onclick = (e) => { e.stopPropagation(); menuAct(it.trail.act, it.trail.arg); };
      row.appendChild(b);
    }
    if (it.sub) {
      const ar = document.createElement('span'); ar.className = 'ar'; ar.innerHTML = MI.chev; row.appendChild(ar);
      row.onmouseenter = () => { clearTimeout(subTimer); subTimer = setTimeout(() => openSub(row, it.sub()), 120); };
      row.onclick = () => { clearTimeout(subTimer); openSub(row, it.sub()); };
    } else {
      if (!isSub) row.onmouseenter = () => { clearTimeout(subTimer); subTimer = setTimeout(closeSub, 200); };
      row.onclick = () => menuAct(it.act, it.arg, it.keep);
    }
    panel.appendChild(row);
  }
  return panel;
}

function zoomRow() {
  const d = menu.data;
  const row = document.createElement('div'); row.className = 'mi zoom';
  const ic = document.createElement('span'); ic.className = 'ic'; ic.innerHTML = MI.find;
  const lb = document.createElement('span'); lb.className = 'lb'; lb.textContent = 'Yakınlaştır';
  const zc = document.createElement('span'); zc.className = 'zc';
  const btn = (svg, title, fn) => { const b = document.createElement('button'); b.className = 'zb'; b.innerHTML = svg; b.title = title; b.onclick = fn; return b; };
  const v = document.createElement('span'); v.className = 'zv'; v.textContent = d.zoom + '%'; v.title = 'Sıfırla (Ctrl+0)';
  v.onclick = () => menuAct('zoom-reset', null, true);
  const s = document.createElement('span'); s.className = 'zs';
  zc.append(btn(MI.minus, 'Küçült (Ctrl+-)', () => menuAct('zoom-out', null, true)), v,
    btn(MI.plus, 'Büyüt (Ctrl++)', () => menuAct('zoom-in', null, true)), s,
    btn(MI.full, 'Tam ekran (F11)', () => menuAct('fullscreen')));
  row.append(ic, lb, zc);
  row.onmouseenter = () => { clearTimeout(subTimer); subTimer = setTimeout(closeSub, 200); };
  return row;
}

// ---------- Volume bubble (from the address bar button; this tab only, 0% - 600%)
function volumePanel(d) {
  const max = d.volumeMax;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const panel = el('div', 'panel vp');
  const h = el('div', 'vh');
  const ic = el('span'); ic.innerHTML = I.audio;
  const v = el('span', 'vv');
  h.append(ic.firstChild, el('span', 'vt', 'Ses düzeyi'), v);
  const rw = el('div', 'vr');
  const r = el('input'); r.type = 'range'; r.min = 0; r.max = max; r.step = 10; r.value = d.volume;
  r.setAttribute('aria-label', 'Ses düzeyi');
  const sc = el('div', 'vs');
  // Labels are placed at the slider's real positions (inset by the 8px thumb radius)
  for (const x of [0, 100, 200, 400, 600].filter((x) => x <= max)) {
    const sp = el('span', null, '%' + x);
    sp.style.left = `calc(8px + (100% - 16px) * ${x / max})`;
    if (x === 0) sp.style.transform = 'translateX(-8px)';
    if (x === max) sp.style.transform = 'translateX(calc(-100% + 8px))';
    sc.append(sp);
  }
  rw.append(r, sc);
  const q = el('div', 'vq');
  const presets = [50, 100, 150, 200, 300, 600].filter((x) => x <= max);
  const qb = presets.map((x) => { const b = el('button', null, '%' + x); b.onclick = () => set(x, true); q.append(b); return [x, b]; });
  const f = el('div', 'vf');
  const reset = el('button', null, 'Normale döndür');
  f.append(el('span', null, 'Sadece bu sekme için'), reset);
  let raf = 0;
  function show(val) {
    v.textContent = '%' + val;
    v.style.color = val > 100 ? 'var(--accent)' : '';
    for (const [x, b] of qb) b.classList.toggle('on', x === val);
  }
  function set(val, now) {
    val = Math.max(0, Math.min(max, Math.round(val / 10) * 10));
    r.value = val; show(val);
    if (now) { cancelAnimationFrame(raf); raf = 0; send('menu-action', { id: 'vol-set', arg: val }); return; }
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; send('menu-action', { id: 'vol-set', arg: Number(r.value) }); });
  }
  r.oninput = () => set(Number(r.value));
  r.onchange = () => set(Number(r.value), true);
  reset.onclick = () => set(100, true);
  panel.onwheel = (e) => { e.preventDefault(); set(Number(r.value) + (e.deltaY < 0 ? 10 : -10), true); };
  show(d.volume);
  panel.append(h, rw, q, f);
  setTimeout(() => r.focus(), 0);
  return panel;
}

// ---------- Extensions panel (puzzle button): like Chrome; click = run, pin = show/hide in toolbar
const PIN = '<svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';
const PIN_OFF = '<svg viewBox="0 0 24 24"><path d="M14 4v5c0 1.12.37 2.16 1 3H9c.65-.86 1-1.9 1-3V4h4m3-2H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3V4h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>';
function extensionsPanel(d) {
  const panel = document.createElement('div'); panel.className = 'panel xp';
  const t = document.createElement('div'); t.className = 'xt'; t.textContent = 'Uzantılar'; panel.append(t);
  const list = d.extensions.filter((e) => e.enabled);
  if (!d.extSupport) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Uzantı desteği yüklenemedi. Klasörde "npm install" komutunu tekrar çalıştırın.'; panel.append(e); }
  else if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Açık uzantı yok. Her uzantı biraz RAM kullanır; sadece gerekenleri ekleyin.'; panel.append(e); }
  for (const x of list) {
    const row = document.createElement('div'); row.className = 'mi';
    const ic = document.createElement('span'); ic.className = 'ic';
    if (x.icon) { const im = document.createElement('img'); im.src = x.icon; im.alt = ''; ic.append(im); } else ic.innerHTML = MI.puzzle;
    const lb = document.createElement('span'); lb.className = 'lb'; lb.textContent = x.name;
    row.append(ic, lb);
    row.title = x.hasAction ? x.name : (x.optionsUrl ? x.name + ' - seçenekleri aç' : x.name);
    row.onclick = () => {
      closeMenu();
      if (!(x.hasAction && activateExt(x.id)) && x.optionsUrl) send('menu-action', { id: 'ext-options', arg: x.id });
    };
    if (x.hasAction) {
      const pin = document.createElement('button'); pin.className = 'pin' + (x.hidden ? '' : ' on');
      pin.innerHTML = x.hidden ? PIN_OFF : PIN;
      pin.title = x.hidden ? 'Araç çubuğunda göster' : 'Araç çubuğundan gizle';
      pin.onclick = (e) => { e.stopPropagation(); send('menu-action', { id: 'ext-hide', arg: { id: x.id, hidden: !x.hidden } }); };
      row.append(pin);
    }
    panel.append(row);
  }
  const sep = document.createElement('div'); sep.className = 'sep'; panel.append(sep);
  const manage = document.createElement('div'); manage.className = 'mi';
  const mi = document.createElement('span'); mi.className = 'ic'; mi.innerHTML = MI.gear;
  const ml = document.createElement('span'); ml.className = 'lb'; ml.textContent = 'Uzantıları yönet';
  manage.append(mi, ml); manage.onclick = () => menuAct('extensions-page');
  panel.append(manage);
  return panel;
}

function closeSub() {
  pop.querySelectorAll('.panel.sub').forEach((p) => p.remove());
  pop.querySelectorAll('.mi.open').forEach((r) => r.classList.remove('open'));
}

function openSub(row, items) {
  closeSub();
  row.classList.add('open');
  const main = pop.querySelector('.panel:not(.sub)');
  const sub = buildPanel(items, true);
  pop.appendChild(sub);
  const mr = main.getBoundingClientRect(), rr = row.getBoundingClientRect();
  const w = sub.offsetWidth, h = sub.offsetHeight;
  let x = mr.left - w + 4;                       // open to the left (menu is at the right edge)
  if (x < 4) x = Math.min(mr.right - 4, innerWidth - w - 4);
  let y = rr.top - 8;
  if (y + h > innerHeight - 4) y = Math.max(4, innerHeight - h - 4);
  sub.style.left = x + 'px';
  sub.style.top = y + 'px';
}

function drawMenu() {
  if (!menu) return;
  const openLabel = pop.querySelector('.mi.open .lb');
  const reopen = openLabel ? openLabel.textContent : null;
  pop.replaceChildren();
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:absolute;inset:0';
  backdrop.onmousedown = closeMenu;
  backdrop.oncontextmenu = (e) => { e.preventDefault(); closeMenu(); };
  pop.appendChild(backdrop);
  const panel = menu.kind === 'volume' ? volumePanel(menu.data) : menu.kind === 'extensions' ? extensionsPanel(menu.data) : buildPanel(menuModel(menu.data, menu.kind), false);
  pop.appendChild(panel);
  const a = menu.anchor;
  const right = Math.min(innerWidth - 6, (a.right || a.x + 34) + 2);
  panel.style.left = Math.max(6, right - panel.offsetWidth) + 'px';
  panel.style.top = ((a.y || 80) + 2) + 'px';
  if (reopen) {
    const row = [...panel.querySelectorAll('.mi')].find((r) => r.querySelector('.lb').textContent === reopen);
    if (row) row.click();
  }
}

browserApi.onMenuOpen((m) => { chooser = null; menu = m; pop.hidden = false; drawMenu(); });
browserApi.onMenuData((d) => { if (menu && menu.kind !== 'volume') { menu.data = d; drawMenu(); } });
// Optional new tab box (settings.newTabPrompt): search or type an address before a tab is created
let promptRows = [], promptSelected = 0, promptTyped = '';
function selectPromptResult(index, fill = false) {
  promptSelected = (index + promptRows.length) % Math.max(1, promptRows.length);
  [...$('newtabResults').children].forEach((el, i) => { el.classList.toggle('sel', i === promptSelected); el.setAttribute('aria-selected', String(i === promptSelected)); });
  if (fill) $('newtabQuery').value = promptSelected === 0 ? promptTyped : promptRows[promptSelected].url;
}
function submitPrompt() {
  const r = promptRows[promptSelected];
  const value = r && r.url ? r.url : $('newtabQuery').value.trim();
  if (value) send('newtab-submit', value);
}
$('newtabQuery').oninput = () => {
  promptTyped = $('newtabQuery').value; promptSelected = 0;
  if (!promptTyped.trim()) { promptRows = []; $('newtabResults').replaceChildren(); $('newtabQuery').setAttribute('aria-expanded', 'false'); return; }
  // Keep the current suggestions visible until their replacement arrives.
  if (promptRows.length) {
    promptRows[0] = { title: promptTyped };
    const label = $('newtabResults').firstElementChild?.querySelector('.result-label');
    if (label) label.textContent = promptTyped;
    selectPromptResult(0);
  }
  send('newtab-query', promptTyped);
};
browserApi.onNewTabResults((r) => {
  if ($('newtabPrompt').hidden || r.q !== promptTyped) return;
  promptRows = r.items.length ? [{ title: promptTyped }, ...r.items] : []; promptSelected = 0;
  $('newtabQuery').setAttribute('aria-expanded', String(promptRows.length > 0));
  const existing = new Map([...$('newtabResults').children].map((row) => [row.dataset.key, row]));
  $('newtabResults').replaceChildren(...promptRows.map((item, i) => {
    const key = item.url || 'query';
    const row = existing.get(key) || document.createElement('button');
    row.dataset.key = key; row.type = 'button'; row.setAttribute('role', 'option');
    let icon = row.firstElementChild;
    if (!icon) { icon = document.createElement('span'); row.append(icon); }
    const iconKey = item.favicon || (i === 0 ? 'search' : item.kind || 'history');
    if (row.dataset.icon !== iconKey) {
      row.dataset.icon = iconKey;
      icon.innerHTML = i === 0 ? I.search : item.kind === 'bm' ? I.starSmall : I.clock;
      if (item.favicon) { const img = document.createElement('img'); img.src = item.favicon; img.alt = ''; img.onerror = () => { icon.innerHTML = I.globe; }; icon.replaceChildren(img); }
    }
    let label = row.querySelector('.result-label');
    if (!label) { label = document.createElement('span'); label.className = 'result-label'; row.append(label); }
    label.textContent = item.title || item.url;
    if (item.url) { const small = document.createElement('small'); small.textContent = prettyUrl(item.url); label.append(small); }
    row.append(icon, label);
    row.onmousedown = (e) => e.preventDefault();
    row.onclick = () => { promptSelected = i; submitPrompt(); };
    row.onmouseenter = () => selectPromptResult(i);
    return row;
  }));
  selectPromptResult(0);
});
browserApi.onNewTabPrompt((d) => {
  promptRows = []; promptSelected = 0; promptTyped = ''; $('newtabResults').replaceChildren(); $('newtabQuery').setAttribute('aria-expanded', 'false');
  $('newtabPrompt').hidden = false; $('newtabQuery').value = '';
  $('newtabQuery').placeholder = L((d.searchName || 'Google') + ' ile arama yapın veya adres yazın', 'Search ' + (d.searchName || 'Google') + ' or type an address');
  $('newtabSearchIcon').innerHTML = I.search;
  requestAnimationFrame(() => $('newtabQuery').focus());
});
$('newtabPrompt').querySelector('form').onsubmit = (e) => { e.preventDefault(); submitPrompt(); };
$('newtabPrompt').onmousedown = (e) => { if (e.target === $('newtabPrompt')) send('newtab-cancel'); };
$('newtabQuery').onkeydown = (e) => {
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && promptRows.length) { e.preventDefault(); selectPromptResult(promptSelected + (e.key === 'ArrowDown' ? 1 : -1), true); }
  else if (e.key === 'Escape') { e.preventDefault(); send('newtab-cancel'); }
};
browserApi.onMenuClosed(() => {
  $('newtabPrompt').hidden = true;
  if (menu || chooser) { menu = null; chooser = null; pop.hidden = true; pop.replaceChildren(); }
  if (!sug.hidden) { sug.hidden = true; sug.replaceChildren(); sugRows = []; }
});
browserApi.onOpenMenu(() => $('menu').click());
browserApi.onFindStep((forward) => { if (findq.value) send('find', { text: findq.value, next: true, forward }); else { findq.focus(); } });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && prompt) { e.preventDefault(); answerPrompt('dismiss'); return; }
  if (e.key === 'Escape' && (menu || chooser)) { e.preventDefault(); closeMenu(); }
  if (e.key === 'Enter' && chooser && chooser.selected) { e.preventDefault(); send('chooser-select', chooser.selected); }
});

// ================================================================ Device chooser bubble (opens below the address bar)
let chooser = null;   // { data, selected }
const CHOOSER_TITLE = {
  serial: 'bir seri bağlantı noktasına bağlanmak istiyor', hid: 'bir HID cihazına bağlanmak istiyor',
  usb: 'bir USB cihazına bağlanmak istiyor', bluetooth: 'bir Bluetooth cihazıyla eşleşmek istiyor'
};
// Bubble skeleton: title (+ optional icon) and x, body, bottom buttons
function bubbleShell(title, icon, onClose) {
  pop.replaceChildren();
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:absolute;inset:0';
  backdrop.onmousedown = onClose;
  backdrop.oncontextmenu = (e) => { e.preventDefault(); onClose(); };
  pop.appendChild(backdrop);
  const box = document.createElement('div'); box.className = 'bubble';
  box.setAttribute('role', 'dialog');
  const h = document.createElement('div'); h.className = 'bh';
  if (icon) { const im = document.createElement('img'); im.src = icon; im.alt = ''; h.append(im); }
  const t = document.createElement('div'); t.className = 'bti'; t.textContent = title;
  const x = document.createElement('button'); x.className = 'bx'; x.innerHTML = PI.close; x.title = 'Kapat'; x.onclick = onClose;
  h.append(t, x);
  const body = document.createElement('div'); body.className = 'bb';
  const foot = document.createElement('div'); foot.className = 'bf';
  box.append(h, body, foot);
  pop.appendChild(box);
  return { box, body, foot };
}
// Like Chrome: right below the site icon at the left of the address bar
function placeBubble(box) {
  const o = $('lead').getBoundingClientRect();
  box.style.left = Math.max(8, Math.min(o.left - 8, innerWidth - box.offsetWidth - 8)) + 'px';
  box.style.top = ($('toolbar').getBoundingClientRect().bottom - 4) + 'px';
}
function footButton(foot, text, fn) { const b = document.createElement('button'); b.textContent = text; b.onclick = fn; foot.append(b); return b; }

function drawChooser() {
  if (!chooser) return;
  const d = chooser.data;
  if (chooser.selected && !d.devices.some((x) => x.id === chooser.selected)) chooser.selected = null;
  if (!chooser.selected && d.devices.length === 1) chooser.selected = d.devices[0].id;
  const old = pop.querySelector('.bubble .dl');
  const listScroll = old ? old.scrollTop : 0;
  const { box, body, foot } = bubbleShell(`${d.host || 'Bu site'} ${CHOOSER_TITLE[d.kind] || 'bir cihaza bağlanmak istiyor'}`, null, closeMenu);
  const list = document.createElement('div'); list.className = 'dl';
  if (!d.devices.length) {
    const w = document.createElement('div'); w.className = 'wait';
    w.innerHTML = '<span class="spin"></span>Uyumlu cihaz aranıyor...<br>Cihazın takılı ve açık olduğundan emin olun.';
    list.appendChild(w);
  }
  for (const dev of d.devices) {
    const r = document.createElement('div');
    r.className = 'dr' + (dev.id === chooser.selected ? ' sel' : '');
    r.innerHTML = PI.serial;
    const tx = document.createElement('div');
    const n = document.createElement('div'); n.className = 'n'; n.textContent = dev.name;
    const s = document.createElement('div'); s.className = 'd'; s.textContent = dev.detail || '';
    tx.append(n, s);
    r.append(tx);
    r.onclick = () => { chooser.selected = dev.id; drawChooser(); };
    r.ondblclick = () => send('chooser-select', dev.id);
    list.appendChild(r);
  }
  body.append(list);
  footButton(foot, 'İptal', closeMenu);
  const ok = footButton(foot, 'Bağlan', () => { if (chooser && chooser.selected) send('chooser-select', chooser.selected); });
  ok.disabled = !chooser.selected;
  list.scrollTop = listScroll || 0;
  placeBubble(box);
}

// ---------- Permission / confirm bubble (location, camera, notifications, extension install...)
let prompt = null;
function answerPrompt(answer) {
  if (!prompt) return;
  const id = prompt.id;
  prompt = null;
  pop.hidden = true; pop.replaceChildren();
  send('prompt-answer', { id, answer });
}
function drawPrompt() {
  const d = prompt;
  const { box, body, foot } = bubbleShell(d.title, d.icon || null, () => answerPrompt('dismiss'));
  if (d.kind === 'ext') { const l = document.createElement('div'); l.className = 'lead'; l.textContent = 'Şunları yapabilir:'; body.append(l); }
  for (const r of d.rows || []) {
    const row = document.createElement('div'); row.className = 'pr';
    row.innerHTML = PI[r.icon] || PI.check;
    const t = document.createElement('span'); t.textContent = r.text;
    row.append(t);
    body.append(row);
  }
  if (d.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = d.note; body.append(n); }
  footButton(foot, d.cancel || 'Engelle', () => answerPrompt('cancel'));
  const ok = footButton(foot, d.ok || 'İzin ver', () => answerPrompt('ok'));
  placeBubble(box);
  setTimeout(() => ok.focus(), 0);
}
browserApi.onPromptOpen((d) => { menu = null; chooser = null; prompt = d; pop.hidden = false; drawPrompt(); });
browserApi.onPromptClose(() => { if (prompt) { prompt = null; pop.hidden = true; pop.replaceChildren(); } });

browserApi.onChooserOpen((d) => { menu = null; chooser = { data: d, selected: null }; pop.hidden = false; drawChooser(); });
browserApi.onChooserData((d) => { if (chooser) { chooser.data = d; drawChooser(); } });
window.addEventListener('blur', () => { /* main process closes the menu when the window loses focus */ });

const anchorOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.bottom, right: r.right }; };
$('menu').onclick = (e) => send('menu', { ...anchorOf(e.currentTarget), kind: 'main' });
$('ext').onclick = (e) => send('menu', { ...anchorOf(e.currentTarget), kind: 'extensions' });
$('vol').onclick = (e) => send('menu', { ...anchorOf(e.currentTarget), kind: 'volume' });

renderLead();
$('reload').innerHTML = I.reload;
</script>
