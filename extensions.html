<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data:">
<script src="i18n.js"></script>
<title>Uzantılar</title>
<style>
  :root { --bg:#f8fafd; --card:#ffffff; --text:#1f1f1f; --dim:#5f6368; --border:#e3e3e3; --hover:rgba(31,31,31,.06);
    --accent:#0b57d0; --accent-fg:#fff; --sel:#d3e3fd; --field:#e9eef6; --off:#c4c7c5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1f1f; --card:#282828; --text:#e3e3e3; --dim:#a8abaf; --border:#3c3c3c; --hover:rgba(227,227,227,.08);
      --accent:#a8c7fa; --accent-fg:#062e6f; --sel:#004a77; --field:#333537; --off:#5f6368; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  [hidden] { display:none !important; }
  html, body { min-height:100%; background:var(--bg); color:var(--text); font:13px "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  svg { width:20px; height:20px; fill:currentColor; flex:none; }
  button { font:inherit; color:inherit; cursor:default; border:0; background:none; }

  header { position:sticky; top:0; z-index:5; height:56px; display:flex; align-items:center; gap:16px; padding-right:24px; background:var(--bg); }
  header.scrolled { box-shadow:0 1px 2px rgba(0,0,0,.12), 0 1px 3px 1px rgba(0,0,0,.06); }
  .brand { width:256px; flex:none; padding-left:24px; font-size:22px; display:flex; align-items:center; gap:14px; }
  .brand svg { color:var(--accent); width:24px; height:24px; }
  .search { flex:1; max-width:680px; height:40px; border-radius:20px; background:var(--field); display:flex; align-items:center; gap:10px; padding:0 16px; }
  .search svg { color:var(--dim); }
  .search input { flex:1; border:0; outline:none; background:none; color:var(--text); font:inherit; font-size:14px; min-width:0; }
  .search:focus-within { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .dev { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--dim); white-space:nowrap; }

  nav { position:fixed; top:56px; left:0; width:256px; padding:8px 12px 0 0; }
  nav a, nav button { width:100%; height:40px; display:flex; align-items:center; gap:16px; padding:0 24px; border-radius:0 20px 20px 0; font-size:14px; text-align:left; color:inherit; text-decoration:none; }
  nav a:hover, nav button:hover { background:var(--hover); }
  nav .on { background:var(--sel); font-weight:600; }
  nav svg { color:var(--dim); }
  nav .on svg { color:var(--accent); }
  nav .sep { height:1px; background:var(--border); margin:8px 0 8px 24px; }
  nav .note { padding:12px 24px; color:var(--dim); line-height:1.5; }
  @media (max-width: 900px) { nav { display:none; } main { margin-left:0 !important; } }

  main { margin-left:256px; padding:8px 24px 64px; }
  .devbar { display:flex; gap:8px; margin:4px 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:16px; max-width:1240px; }
  .card { background:var(--card); border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 1px 3px 1px rgba(0,0,0,.04); display:flex; flex-direction:column; min-height:164px; }
  .card.off .top { opacity:.55; }
  .top { display:flex; gap:16px; padding:20px 20px 12px; flex:1; }
  .ico { width:40px; height:40px; flex:none; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--field); color:var(--dim); overflow:hidden; }
  .ico img { width:40px; height:40px; object-fit:contain; }
  .info { min-width:0; flex:1; }
  .nm { font-size:14px; font-weight:600; display:flex; align-items:baseline; gap:8px; }
  .nm span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ver { color:var(--dim); font-weight:400; font-size:12px; white-space:nowrap; }
  .ds { color:var(--dim); margin-top:6px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .id { color:var(--dim); margin-top:6px; font-size:11px; font-family:Consolas, monospace; user-select:text; }
  .tag { display:inline-block; margin-top:6px; font-size:11px; color:var(--dim); border:1px solid var(--border); border-radius:4px; padding:0 5px; }
  .bot { display:flex; align-items:center; gap:4px; padding:8px 16px 12px; }
  .btn { height:32px; padding:0 14px; border-radius:16px; border:1px solid var(--border); color:var(--accent); font-weight:500; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn:disabled { opacity:.45; }
  .sp { flex:1; }
  .icb { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  .icb:hover { background:var(--hover); }
  .icb.on { color:var(--accent); }
  .icb svg { width:18px; height:18px; }
  .icb:disabled { opacity:.35; }
  .sw { position:relative; width:36px; height:20px; flex:none; border-radius:10px; background:var(--off); transition:background .15s; margin-left:6px; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; }
  .sw.on { background:var(--accent); }
  .sw.on::after { transform:translateX(16px); background:var(--accent-fg); }
  .empty { max-width:560px; margin:48px auto; text-align:center; color:var(--dim); line-height:1.6; }
  .empty svg { width:72px; height:72px; opacity:.35; margin-bottom:12px; }
  .empty .btn { margin-top:16px; }
</style>
</head>
<body>
  <header id="hdr">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 000-5z"/></svg>Uzantılar</div>
    <label class="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" placeholder="Uzantılarda ara" spellcheck="false"></label>
    <div class="dev">Geliştirici modu <button class="sw" id="devsw" role="switch"></button></div>
  </header>

  <nav>
    <a class="on"><svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 000-5z"/></svg>Uzantılarım</a>
    <button id="toSettings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Yerleşik araçlar (Ayarlar)</button>
    <div class="sep"></div>
    <button id="store"><svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>Chrome Web Mağazası</button>
    <div class="note">Her açık uzantı arka planda çalışır ve RAM kullanır. Kullanmadıklarınızı kapatın; kapalı uzantı hiç yüklenmez.</div>
  </nav>

  <main>
    <div class="devbar" id="devbar" hidden><button class="btn" id="load">Paketlenmemiş öğe yükle</button></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const api = window.pageApi;
let d = null;
const PUZZLE = '<svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 000-5z"/></svg>';
const PIN = '<svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';
const PIN_OFF = '<svg viewBox="0 0 24 24"><path d="M14 4v5c0 1.12.37 2.16 1 3H9c.65-.86 1-1.9 1-3V4h4m3-2H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3V4h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>';

function applyTheme(t) {
  const st = document.documentElement.style;
  for (const n of ['--bg', '--accent', '--card', '--field', '--sel']) st.removeProperty(n);
  if (!t) return;
  st.setProperty('--bg', t.page); st.setProperty('--accent', t.accent);
  st.setProperty('--sel', `color-mix(in srgb, ${t.accent} 28%, transparent)`);
  if (t.mode === 'dark') { st.setProperty('--card', t.toolbar); st.setProperty('--field', t.toolbar); }
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const call = (cmd, arg) => api.call(cmd, arg).then(load);

function card(x) {
  const c = el('div', 'card' + (x.enabled ? '' : ' off'));
  const top = el('div', 'top');
  const ico = el('div', 'ico');
  if (x.icon) { const im = el('img'); im.src = x.icon; im.alt = ''; ico.append(im); } else ico.innerHTML = PUZZLE;
  const info = el('div', 'info');
  const nm = el('div', 'nm'); nm.append(el('span', null, x.name), el('span', 'ver', x.version));
  info.append(nm);
  if (x.description) info.append(el('div', 'ds', x.description));
  if (x.unpacked) info.append(el('span', 'tag', 'Paketlenmemiş'));
  if (x.builtin) info.append(el('span', 'tag', 'Mondium ile gelir'));
  if (d.devMode) info.append(el('div', 'id', 'Kimlik: ' + x.id));
  top.append(ico, info);

  const bot = el('div', 'bot');
  if (!x.builtin) { const rm = el('button', 'btn', 'Kaldır'); rm.onclick = () => call('ext-remove', x.id); bot.append(rm); }
  if (x.optionsUrl) { const op = el('button', 'btn', 'Seçenekler'); op.disabled = !x.enabled; op.onclick = () => api.call('ext-options', x.id); bot.append(op); }
  bot.append(el('span', 'sp'));
  if (x.hasAction) {
    const pin = el('button', 'icb' + (x.hidden ? '' : ' on'));
    pin.innerHTML = x.hidden ? PIN_OFF : PIN;
    pin.title = x.hidden ? 'Araç çubuğunda gizli. Göstermek için tıklayın.' : 'Araç çubuğunda görünüyor. Gizlemek için tıklayın.';
    pin.disabled = !x.enabled;
    pin.onclick = () => call('ext-hide', { id: x.id, hidden: !x.hidden });
    bot.append(pin);
  }
  const sw = el('button', 'sw' + (x.enabled ? ' on' : ''));
  sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', String(x.enabled));
  sw.title = x.enabled ? 'Açık. Kapatınca uzantı hiç yüklenmez, RAM harcamaz.' : 'Kapalı';
  sw.onclick = () => { sw.classList.toggle('on'); call('ext-enable', { id: x.id, on: !x.enabled }); };
  if (x.builtin) { sw.disabled = true; sw.title = 'Yerleşik reklam engelleyici, her zaman açık'; }
  bot.append(sw);
  c.append(top, bot);
  return c;
}

function render() {
  $('devsw').classList.toggle('on', d.devMode);
  $('devbar').hidden = !d.devMode;
  const q = $('q').value.trim().toLocaleLowerCase('tr');
  const list = d.list.filter((x) => !q || (x.name + ' ' + x.description).toLocaleLowerCase('tr').includes(q));
  $('grid').replaceChildren(...list.map(card));
  const empty = $('empty');
  empty.hidden = list.length > 0;
  if (!list.length) {
    empty.replaceChildren();
    const ic = el('div'); ic.innerHTML = PUZZLE; empty.append(ic.firstChild);
    if (!d.extSupport) empty.append(el('div', null, 'Uzantı desteği yüklenemedi. Klasörde "npm install" komutunu tekrar çalıştırın.'));
    else if (q) empty.append(el('div', null, 'Aramanızla eşleşen uzantı yok.'));
    else {
      empty.append(el('div', null, 'Henüz uzantı yok. Chrome Web Mağazası\'ndan ekleyebilirsiniz.'));
      if (d.webStore) { const b = el('button', 'btn', 'Web Mağazası\'nı aç'); b.onclick = () => api.call('web-store'); empty.append(el('br'), b); }
    }
  }
}

async function load() { if (!api) return; d = await api.call('ext-list'); render(); }
$('q').oninput = () => d && render();
$('devsw').onclick = () => api.call('ext-devmode', !d.devMode).then(load);
$('load').onclick = () => call('ext-load');
$('store').onclick = () => api.call('web-store');
$('toSettings').onclick = () => api.call('open-page', 'settings');
window.addEventListener('scroll', () => $('hdr').classList.toggle('scrolled', scrollY > 0), { passive: true });
window.addEventListener('keydown', (e) => { if ((e.ctrlKey && e.key === 'f') || (e.key === '/' && document.activeElement !== $('q'))) { e.preventDefault(); $('q').focus(); } });
if (api) {
  api.onUpdate((p) => { applyTheme(p.theme); if (!p.changed || p.changed === 'extensions') load(); });
  api.get().then((p) => applyTheme(p.theme)).catch(() => {});
  load();
}
</script>
</body>
</html>
