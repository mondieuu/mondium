<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data:">
<script src="i18n.js"></script>
<title>Yeni Sekme</title>
<style>
  :root { --bg:#ffffff; --text:#1f1f1f; --dim:#5f6368; --box:#ffffff; --border:#dadce0; --shadow:0 1px 6px rgba(32,33,36,.28);
    --icon:#9aa0a6; --tile:#f1f3f4; --hover:rgba(31,31,31,.06); --accent:#0b57d0; --accent-fg:#fff; --modal:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202124; --text:#e8eaed; --dim:#9aa0a6; --box:#303134; --border:#5f6368; --shadow:0 1px 6px rgba(0,0,0,.6);
      --tile:#35363a; --hover:rgba(232,234,237,.08); --accent:#a8c7fa; --accent-fg:#062e6f; --modal:#2d2f31; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { display:flex; flex-direction:column; align-items:center; padding-top:20vh; }
  /* Title: a pencil appears on hover, click to edit in place */
  .head { position:relative; min-height:84px; margin-bottom:26px; display:flex; align-items:center; justify-content:center; max-width:90vw; }
  h1 { color:var(--dim); font-size:60px; font-weight:400; letter-spacing:-2px; user-select:none; outline:none; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:80vw; border-radius:10px; padding:0 10px; }
  h1:empty::before { content:"Başlık ekle"; font-size:20px; letter-spacing:0; opacity:0; }
  .head:hover h1:empty::before { opacity:.6; }
  h1[contenteditable] { background:var(--hover); user-select:text; cursor:text; }
  h1[contenteditable]:empty::before { content:""; }
  #editTitle { position:absolute; right:-36px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:0; border-radius:50%;
    background:none; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
  .head:hover #editTitle { opacity:1; }
  #editTitle:hover { background:var(--hover); }
  #editTitle svg { width:16px; height:16px; fill:var(--dim); }
  form { width:min(584px, 90vw); height:46px; display:flex; align-items:center; border:1px solid var(--border);
    border-radius:24px; background:var(--box); padding:0 16px; gap:12px; }
  form:hover, form:focus-within { box-shadow:var(--shadow); border-color:transparent; }
  svg { width:20px; height:20px; fill:var(--icon); flex:none; }
  #q { flex:1; height:100%; border:0; outline:none; background:none; color:var(--text); font-size:16px; }

  /* ---------- Shortcuts ---------- */
  #tiles { display:grid; grid-template-columns:repeat(6, 112px); gap:4px 8px; margin-top:32px; justify-content:center; }
  @media (max-width: 760px) { #tiles { grid-template-columns:repeat(4, 112px); } }
  .tile { position:relative; width:112px; height:112px; border-radius:8px; display:flex; flex-direction:column; align-items:center;
    padding-top:16px; text-decoration:none; color:var(--text); user-select:none; }
  .tile:hover { background:var(--hover); }
  .tile.drag { opacity:.4; }
  .ic { width:48px; height:48px; border-radius:50%; background:var(--tile); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; }
  .ic img { width:28px; height:28px; object-fit:contain; border-radius:4px; }
  .ic .letter { width:48px; height:48px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:500; }
  .ic .plus svg { width:24px; height:24px; fill:var(--text); }
  .name { margin-top:12px; font-size:13px; max-width:96px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:center; }
  .tools { position:absolute; top:4px; right:4px; display:none; gap:0; }
  .tile:hover .tools { display:flex; }
  .tools button { width:24px; height:24px; border:0; border-radius:50%; background:none; display:flex; align-items:center; justify-content:center; cursor:default; }
  .tools button:hover { background:var(--hover); }
  .tools svg { width:15px; height:15px; fill:var(--dim); }

  /* ---------- Add / edit shortcut dialog ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:10; }
  #modal[hidden] { display:none; }
  .dlg { width:min(420px, 92vw); background:var(--modal); border-radius:12px; padding:24px; box-shadow:0 8px 32px rgba(0,0,0,.3); }
  .dlg h2 { font-size:18px; font-weight:400; margin-bottom:18px; }
  .dlg label { display:block; font-size:12px; color:var(--dim); margin:12px 0 6px; }
  .dlg input { width:100%; height:36px; border:1px solid var(--border); border-radius:6px; background:none; color:var(--text);
    padding:0 10px; font-size:14px; outline:none; }
  .dlg input:focus { border-color:var(--accent); border-width:2px; padding:0 9px; }
  .dlg .err { color:#d93025; font-size:12px; min-height:18px; margin-top:8px; }
  .dlg .row { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .dlg button { height:34px; padding:0 18px; border-radius:17px; border:1px solid var(--border); background:none; color:var(--accent); font-size:13px; font-weight:500; }
  .dlg button.pri { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .dlg button:disabled { opacity:.4; }
  #incogNote { max-width:560px; margin:-8px auto 22px; text-align:center; color:var(--dim); font-size:13px; line-height:1.5; }
  #editTitle[hidden] { display:none; }
</style>
</head>
<body>
  <main>
    <div class="head">
      <h1 id="title" title="Değiştirmek için çift tıklayın"></h1>
      <button id="editTitle" title="Başlığı değiştir"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
    </div>
    <p id="incogNote" hidden>Bu pencerede gezdiğiniz sayfalar geçmişe yazılmaz; çerezler ve site verileri son gizli pencere kapanınca silinir. İndirdiğiniz dosyalar ve yer işaretleri kalır.</p>
    <form id="f">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" placeholder="Web'de arayın veya URL yazın" autocomplete="off" spellcheck="false">
    </form>
    <div id="tiles"></div>
  </main>

  <div id="modal" hidden>
    <div class="dlg">
      <h2 id="mt">Kısayol ekle</h2>
      <label for="mn">Ad</label>
      <input id="mn" maxlength="40" spellcheck="false">
      <label for="mu">URL</label>
      <input id="mu" spellcheck="false" placeholder="ornek.com">
      <div class="err" id="me"></div>
      <div class="row">
        <button id="mc">İptal</button>
        <button id="mok" class="pri">Bitti</button>
      </div>
    </div>
  </div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const api = window.pageApi;
const SVG = {
  plus: '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  del: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
};
const LETTER_COLORS = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#c5221f', '#007b83', '#b06000', '#3c4043', '#a142f4'];
let data = { shortcuts: [], searchUrl: decodeURIComponent(location.hash.slice(1)) || 'https://www.google.com/search?pws=0&q=', searchName: 'Google', theme: null };
const MAX = 12;

// ---------- Search
$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('q').value.trim();
  if (!v) return;
  const looksUrl = !/\s/.test(v) && /^(https?:\/\/)?[^\s/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(v);
  location.href = looksUrl ? (/^https?:/i.test(v) ? v : 'https://' + v) : data.searchUrl + encodeURIComponent(v);
});

// ---------- Theme
function applyTheme(t) {
  const st = document.documentElement.style;
  if (!t) { ['--bg', '--accent', '--box', '--modal'].forEach((n) => st.removeProperty(n)); return; }
  st.setProperty('--bg', t.page);
  st.setProperty('--accent', t.accent);
  if (t.mode === 'dark') { st.setProperty('--box', t.toolbar); st.setProperty('--modal', t.toolbar); }
  else { st.removeProperty('--box'); st.removeProperty('--modal'); }
}

// ---------- Shortcuts
function hostName(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } }
function letterFor(s) {
  const name = (s.title || hostName(s.url)).trim();
  const ch = (name.match(/[\p{L}\p{N}]/u) || ['?'])[0].toLocaleUpperCase('tr');
  let h = 0;
  for (const c of hostName(s.url)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const el = document.createElement('div');
  el.className = 'letter';
  el.style.background = LETTER_COLORS[h % LETTER_COLORS.length];
  el.textContent = ch;
  return el;
}

let dragFrom = -1;
// ---------- Title (user-editable; hidden if left empty)
const titleEl = $('title');
let titleEditing = false;
function startTitleEdit() {
  if (!api || titleEditing || (data && data.incognito)) return;
  titleEditing = true;
  titleEl.contentEditable = 'plaintext-only';
  titleEl.focus();
  const r = document.createRange(); r.selectNodeContents(titleEl);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function endTitleEdit(save) {
  if (!titleEditing) return;
  titleEditing = false;
  titleEl.removeAttribute('contenteditable');
  const v = titleEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 40);
  if (save && v !== (data.newtabTitle ?? 'Mondium')) { data.newtabTitle = v; api.call('newtab-title', v); }
  titleEl.textContent = data.newtabTitle ?? 'Mondium';
}
$('editTitle').onclick = startTitleEdit;
titleEl.ondblclick = startTitleEdit;
titleEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); endTitleEdit(true); $('q').focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); endTitleEdit(false); }
  else if (titleEl.textContent.length >= 40 && e.key.length === 1 && !getSelection().toString()) e.preventDefault();
});
titleEl.addEventListener('blur', () => endTitleEdit(true));

function render() {
  $('q').placeholder = `${data.searchName} ile arayın veya URL yazın`;
  if (!titleEditing) titleEl.textContent = data.incognito ? 'Gizli pencere' : (data.newtabTitle ?? 'Mondium');
  $('editTitle').hidden = !!data.incognito;
  $('incogNote').hidden = !data.incognito;
  applyTheme(data.theme);
  const tiles = data.shortcuts.map((s, i) => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = s.url;
    a.title = s.title + '\n' + s.url;
    a.draggable = true;
    const ic = document.createElement('div'); ic.className = 'ic';
    if (s.icon) {
      const im = document.createElement('img'); im.src = s.icon; im.alt = '';
      im.onerror = () => ic.replaceChildren(letterFor(s));
      ic.appendChild(im);
    } else ic.appendChild(letterFor(s));
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = s.title;
    const tools = document.createElement('div'); tools.className = 'tools';
    const be = document.createElement('button'); be.innerHTML = SVG.edit; be.title = 'Düzenle';
    be.onclick = (e) => { e.preventDefault(); openModal(i); };
    const bd = document.createElement('button'); bd.innerHTML = SVG.del; bd.title = 'Kaldır';
    bd.onclick = (e) => { e.preventDefault(); api && api.call('remove', i); };
    tools.append(be, bd);
    a.append(ic, nm, tools);
    a.addEventListener('dragstart', () => { dragFrom = i; a.classList.add('drag'); });
    a.addEventListener('dragend', () => a.classList.remove('drag'));
    a.addEventListener('dragover', (e) => e.preventDefault());
    a.addEventListener('drop', (e) => { e.preventDefault(); if (dragFrom >= 0 && dragFrom !== i && api) api.call('move', { from: dragFrom, to: i }); dragFrom = -1; });
    return a;
  });
  if (api && data.shortcuts.length < MAX) {
    const add = document.createElement('a');
    add.className = 'tile'; add.href = '#'; add.title = 'Kısayol ekle';
    add.innerHTML = `<div class="ic"><span class="plus">${SVG.plus}</span></div><div class="name">Kısayol ekle</div>`;
    add.onclick = (e) => { e.preventDefault(); openModal(-1); };
    tiles.push(add);
  }
  $('tiles').replaceChildren(...tiles);
}

// ---------- Add / edit dialog
let editing = -1;
function openModal(i) {
  editing = i;
  const s = data.shortcuts[i];
  $('mt').textContent = s ? 'Kısayolu düzenle' : 'Kısayol ekle';
  $('mn').value = s ? s.title : '';
  $('mu').value = s ? s.url : '';
  $('me').textContent = '';
  $('modal').hidden = false;
  (s ? $('mn') : $('mu')).focus();
}
function closeModal() { $('modal').hidden = true; }
async function saveModal() {
  if (!api) return;
  const r = await api.call(editing >= 0 ? 'edit' : 'add', { i: editing, title: $('mn').value, url: $('mu').value });
  if (r && r.error) { $('me').textContent = r.error; return; }
  closeModal();
}
$('mc').onclick = closeModal;
$('mok').onclick = saveModal;
$('modal').addEventListener('mousedown', (e) => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if ($('modal').hidden) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter') saveModal();
});

// ---------- Startup
if (api) {
  api.onUpdate((d) => { data = d; render(); });
  api.get().then((d) => { data = d; render(); }).catch(() => render());
} else render();
</script>
</body>
</html>
