<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:; img-src data:">
<script src="i18n.js"></script>
<title>Yeni Sekme</title>
<style>
  :root { --bg:#ffffff; --text:#1f1f1f; --dim:#5f6368; --box:#ffffff; --border:#dadce0; --shadow:0 1px 6px rgba(32,33,36,.28);
    --icon:#9aa0a6; --tile:#f1f3f4; --hover:rgba(31,31,31,.06); --accent:#0b57d0; --accent-fg:#fff; --modal:#ffffff; --logo-mix:20%; --logo-shade:rgba(0,0,0,.26); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#202124; --text:#e8eaed; --dim:#9aa0a6; --box:#303134; --border:#5f6368; --shadow:0 1px 6px rgba(0,0,0,.6);
      --tile:#35363a; --hover:rgba(232,234,237,.08); --accent:#a8c7fa; --accent-fg:#062e6f; --modal:#2d2f31; --logo-mix:30%; --logo-shade:rgba(0,0,0,.55); }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { display:flex; flex-direction:column; align-items:center; padding-top:18vh; }
  body.clock-top main { padding-top:10vh; }
  .head { display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:28px; }
  /* Logo: the ring from the app icon in a soft gray, with an inner shadow so it looks carved into the page */
  #logo { width:92px; height:92px; flex:none; fill:none; stroke:color-mix(in srgb, var(--text) var(--logo-mix), var(--bg)); stroke-width:50; stroke-linecap:round; }
  #logo feFlood { flood-color:var(--logo-shade); }
  #incogTitle { color:var(--dim); font-size:18px; }
  /* Clock: above the logo or in a corner; size and position come from settings */
  #clock { color:var(--text); font-family:var(--clock-font, inherit); font-size:var(--clock-size, 56px); font-weight:var(--clock-weight, 300); line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap; user-select:none; margin-bottom:calc(var(--clock-size, 56px) * .28); }
  #clock.corner { margin-bottom:0; }
  #clock[hidden] { display:none; }
  #clock.corner { position:fixed; z-index:2; }
  #clock.tl { top:24px; left:28px; } #clock.tr { top:24px; right:28px; }
  #clock.bl { bottom:24px; left:28px; } #clock.br { bottom:24px; right:28px; }
  /* Customize panel */
  #custom { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:3; height:32px; padding:0 14px; display:flex; align-items:center; gap:8px; border:0; border-radius:16px;
    background:none; color:var(--dim); font-size:12px; opacity:.55; cursor:pointer; transition:opacity .15s, background .15s; }
  #custom:hover, #custom[aria-expanded="true"] { opacity:1; background:var(--hover); }
  #custom svg { width:15px; height:15px; fill:currentColor; }
  #custom[hidden] { display:none; }
  #panel { position:fixed; left:50%; bottom:54px; transform:translateX(-50%); z-index:4; width:min(380px, 92vw); padding:16px 18px; background:var(--modal); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,.28); font-size:13px; }
  #panel[hidden] { display:none; }
  #panel h3 { font-size:12px; font-weight:500; color:var(--dim); margin-bottom:8px; }
  #panel h3:not(:first-child) { margin-top:14px; }
  #pos { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  #pos button { height:32px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--text); font-size:12px; cursor:pointer; }
  #pos button:hover { background:var(--hover); }
  #pos button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  #panel select { width:100%; height:32px; padding:0 8px; border:1px solid var(--border); border-radius:8px; background:var(--modal); color:var(--text); font-size:13px; }
  #panel select:disabled, #pos ~ .size-row input:disabled { opacity:.4; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .two h3 { margin-top:0 !important; }
  .size-row { display:flex; align-items:center; gap:10px; }
  #size { flex:1; accent-color:var(--accent); }
  #size:disabled { opacity:.4; }
  #sizeVal { width:48px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  form { width:min(584px, 90vw); height:46px; display:flex; align-items:center; border:1px solid var(--border);
    border-radius:24px; background:var(--box); padding:0 16px; gap:12px; }
  form:hover, form:focus-within { box-shadow:var(--shadow); border-color:transparent; }
  svg { width:20px; height:20px; fill:var(--icon); flex:none; }
  #q { flex:1; height:100%; border:0; outline:none; background:none; color:var(--text); font-size:16px; }

  /* ---------- Shortcuts ---------- */
  #tiles { display:grid; grid-template-columns:repeat(6, 112px); gap:4px 8px; margin-top:32px; justify-content:center; }
  @media (max-width: 760px) { #tiles { grid-template-columns:repeat(4, 112px); } }
  .tile { position:relative; width:112px; height:112px; border-radius:8px; display:flex; flex-direction:column; align-items:center;
    padding-top:16px; text-decoration:none; color:var(--text); user-select:none; }
  .tile:hover { background:var(--hover); }
  .tile.drag { opacity:.4; }
  .ic { width:48px; height:48px; border-radius:50%; background:var(--tile); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; }
  .ic img { width:28px; height:28px; object-fit:contain; border-radius:4px; }
  .ic .letter { width:48px; height:48px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:500; }
  .ic .plus svg { width:24px; height:24px; fill:var(--text); }
  .name { margin-top:12px; font-size:13px; max-width:96px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:center; }
  .tools { position:absolute; top:4px; right:4px; display:none; gap:0; }
  .tile:hover .tools { display:flex; }
  .tools button { width:24px; height:24px; border:0; border-radius:50%; background:none; display:flex; align-items:center; justify-content:center; cursor:default; }
  .tools button:hover { background:var(--hover); }
  .tools svg { width:15px; height:15px; fill:var(--dim); }

  /* ---------- Add / edit shortcut dialog ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:10; }
  #modal[hidden] { display:none; }
  .dlg { width:min(420px, 92vw); background:var(--modal); border-radius:12px; padding:24px; box-shadow:0 8px 32px rgba(0,0,0,.3); }
  .dlg h2 { font-size:18px; font-weight:400; margin-bottom:18px; }
  .dlg label { display:block; font-size:12px; color:var(--dim); margin:12px 0 6px; }
  .dlg input { width:100%; height:36px; border:1px solid var(--border); border-radius:6px; background:none; color:var(--text);
    padding:0 10px; font-size:14px; outline:none; }
  .dlg input:focus { border-color:var(--accent); border-width:2px; padding:0 9px; }
  .dlg .err { color:#d93025; font-size:12px; min-height:18px; margin-top:8px; }
  .dlg .row { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .dlg button { height:34px; padding:0 18px; border-radius:17px; border:1px solid var(--border); background:none; color:var(--accent); font-size:13px; font-weight:500; }
  .dlg button.pri { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .dlg button:disabled { opacity:.4; }
  #incogNote { max-width:560px; margin:-8px auto 22px; text-align:center; color:var(--dim); font-size:13px; line-height:1.5; }
</style>
</head>
<body>
  <main>
    <div class="head">
      <div id="clock" hidden></div>
      <svg id="logo" viewBox="130 130 252 252" role="img" aria-label="Mondium"><defs><filter id="carve" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/><feOffset in="blur" dy="10" result="offset"/><feComposite in="SourceAlpha" in2="offset" operator="out" result="edge"/><feFlood/><feComposite in2="edge" operator="in" result="shade"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge></filter></defs><path filter="url(#carve)" d="M245 155A101 101 0 1 0 355 268"/></svg>
      <div id="incogTitle" hidden>Gizli pencere</div>
    </div>
    <p id="incogNote" hidden>Bu pencerede gezdiğiniz sayfalar geçmişe yazılmaz; çerezler ve site verileri son gizli pencere kapanınca silinir. İndirdiğiniz dosyalar ve yer işaretleri kalır.</p>
    <form id="f">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="q" placeholder="Web'de arayın veya URL yazın" autocomplete="off" spellcheck="false">
    </form>
    <div id="tiles"></div>
  </main>

  <button id="custom" aria-expanded="false" aria-controls="panel" hidden><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span>Özelleştir</span></button>
  <div id="panel" role="dialog" aria-label="Özelleştir" hidden>
    <h3>Saatin yeri</h3>
    <div id="pos">
      <button data-p="tl">Sol üst</button><button data-p="top">Logonun üstü</button><button data-p="tr">Sağ üst</button>
      <button data-p="bl">Sol alt</button><button data-p="off">Kapalı</button><button data-p="br">Sağ alt</button>
    </div>
    <h3>Saatin boyutu</h3>
    <div class="size-row"><input id="size" type="range" min="20" max="140" step="2" aria-label="Saatin boyutu"><span id="sizeVal"></span></div>
    <div class="two">
      <div><h3>Yazı tipi</h3><select id="clockFont" aria-label="Yazı tipi"></select></div>
      <div><h3>Kalınlık</h3><select id="clockWeight" aria-label="Kalınlık"></select></div>
    </div>
  </div>

  <div id="modal" hidden>
    <div class="dlg">
      <h2 id="mt">Kısayol ekle</h2>
      <label for="mn">Ad</label>
      <input id="mn" maxlength="40" spellcheck="false">
      <label for="mu">URL</label>
      <input id="mu" spellcheck="false" placeholder="ornek.com">
      <div class="err" id="me"></div>
      <div class="row">
        <button id="mc">İptal</button>
        <button id="mok" class="pri">Bitti</button>
      </div>
    </div>
  </div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const api = window.pageApi;
const SVG = {
  plus: '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  del: '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'
};
const LETTER_COLORS = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#c5221f', '#007b83', '#b06000', '#3c4043', '#a142f4'];
// The main process puts the search address in the hash. Only a web address counts: a link to this page must not choose where the search box goes.
const initialSearch = (hash) => { try { const u = decodeURIComponent(hash); return /^https:\/\//i.test(u) ? u : ''; } catch { return ''; } };
let data = { shortcuts: [], searchUrl: initialSearch(location.hash.slice(1)) || 'https://www.google.com/search?pws=0&q=', searchName: 'Google', theme: null };
const MAX = 12;

// ---------- Search
$('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('q').value.trim();
  if (!v) return;
  const looksUrl = !/\s/.test(v) && /^(https?:\/\/)?[^\s/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(v);
  location.href = looksUrl ? (/^https?:/i.test(v) ? v : 'https://' + v) : data.searchUrl + encodeURIComponent(v);
});

// ---------- Theme
function applyTheme(t) {
  const st = document.documentElement.style;
  if (!t) { ['--bg', '--accent', '--accent-fg', '--box', '--modal'].forEach((n) => st.removeProperty(n)); return; }
  st.setProperty('--bg', t.page);
  st.setProperty('--accent', t.accent); st.setProperty('--accent-fg', t.edge ? t.frame : '');
  if (t.mode === 'dark') { st.setProperty('--box', t.toolbar); st.setProperty('--modal', t.toolbar); }
  else { st.removeProperty('--box'); st.removeProperty('--modal'); }
}

// ---------- Shortcuts
function hostName(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } }
function letterFor(s) {
  const name = (s.title || hostName(s.url)).trim();
  const ch = (name.match(/[\p{L}\p{N}]/u) || ['?'])[0].toLocaleUpperCase('tr');
  let h = 0;
  for (const c of hostName(s.url)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const el = document.createElement('div');
  el.className = 'letter';
  el.style.background = LETTER_COLORS[h % LETTER_COLORS.length];
  el.textContent = ch;
  return el;
}

let dragFrom = -1;
// ---------- Title (user-editable; hidden if left empty)

// ---------- Clock
const CLOCK_DEFAULT = 56;
const fmtClock = new Intl.DateTimeFormat(window.LANG === 'en' ? 'en-US' : 'tr-TR', { hour: '2-digit', minute: '2-digit' });
let clockTimer = 0;
function tickClock() {
  clearTimeout(clockTimer); clockTimer = 0;
  if ($('clock').hidden || document.hidden) return;   // no timer while hidden: refreshed on visibilitychange
  const now = new Date();
  $('clock').textContent = fmtClock.format(now);
  clockTimer = setTimeout(tickClock, 60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 20);   // right after the minute changes
}
document.addEventListener('visibilitychange', tickClock);
// Fonts that ship with Windows; the same keys are validated in the main process.
const CLOCK_FONTS = { system: ['Sistem', '"Segoe UI", system-ui, sans-serif'], bahnschrift: ['Bahnschrift', 'Bahnschrift, "Segoe UI", sans-serif'], georgia: ['Georgia', 'Georgia, serif'], times: ['Times New Roman', '"Times New Roman", serif'], trebuchet: ['Trebuchet MS', '"Trebuchet MS", sans-serif'], verdana: ['Verdana', 'Verdana, sans-serif'], consolas: ['Consolas', 'Consolas, monospace'], courier: ['Courier New', '"Courier New", monospace'], script: ['Segoe Script', '"Segoe Script", cursive'], impact: ['Impact', 'Impact, sans-serif'] };
const CLOCK_WEIGHTS = [[300, 'İnce'], [400, 'Normal'], [600, 'Yarı kalın'], [700, 'Kalın'], [900, 'Çok kalın']];
for (const [key, [label, family]] of Object.entries(CLOCK_FONTS)) { const o = document.createElement('option'); o.value = key; o.textContent = label; o.style.fontFamily = family; $('clockFont').append(o); }
for (const [value, label] of CLOCK_WEIGHTS) { const o = document.createElement('option'); o.value = value; o.textContent = label; $('clockWeight').append(o); }
function applyClockStyle(font, weight) {
  const st = document.documentElement.style, known = CLOCK_FONTS[font] || CLOCK_FONTS.system;
  st.setProperty('--clock-font', known[1]);
  st.setProperty('--clock-weight', weight);
  $('clockFont').value = CLOCK_FONTS[font] ? font : 'system';
  $('clockWeight').value = weight;
}
function applyClock(position, size) {
  const c = $('clock'), corner = ['tl', 'tr', 'bl', 'br'].includes(position);
  c.hidden = !(corner || position === 'top');
  c.className = corner ? 'corner ' + position : '';
  document.documentElement.style.setProperty('--clock-size', size + 'px');
  document.body.classList.toggle('clock-top', position === 'top');
  for (const b of $('pos').children) b.classList.toggle('on', b.dataset.p === position);
  $('size').value = size; $('size').disabled = c.hidden;
  $('clockFont').disabled = c.hidden; $('clockWeight').disabled = c.hidden;
  $('sizeVal').textContent = size + ' px';
  tickClock();
}
function saveClock() {
  Object.assign(data, { clockPosition: position(), clockSize: Number($('size').value), clockFont: $('clockFont').value, clockWeight: Number($('clockWeight').value) });
  if (api) api.call('newtab-clock', { position: data.clockPosition, size: data.clockSize, font: data.clockFont, weight: data.clockWeight });
}
const position = () => ($('pos').querySelector('.on') || {}).dataset?.p || 'off';
for (const b of $('pos').children) b.onclick = () => { applyClock(b.dataset.p, Number($('size').value)); saveClock(); };
// Live while dragging; saved on release so other pages are not redrawn on every step.
$('size').oninput = () => applyClock(position(), Number($('size').value));
$('size').onchange = saveClock;
$('clockFont').onchange = $('clockWeight').onchange = () => { applyClockStyle($('clockFont').value, Number($('clockWeight').value)); saveClock(); };
function togglePanel(open) { $('panel').hidden = !open; $('custom').setAttribute('aria-expanded', String(open)); }
$('custom').onclick = () => togglePanel($('panel').hidden);
document.addEventListener('mousedown', (e) => { if (!$('panel').hidden && !$('panel').contains(e.target) && !$('custom').contains(e.target)) togglePanel(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('panel').hidden) togglePanel(false); });

function render() {
  $('q').placeholder = `${data.searchName} ile arayın veya URL yazın`;
  $('incogTitle').hidden = !data.incognito;
  $('custom').hidden = !api || !!data.incognito;
  if (data.incognito) togglePanel(false);
  applyClockStyle(data.clockFont, data.clockWeight || 300);
  applyClock(data.clockPosition || 'top', data.clockSize || CLOCK_DEFAULT);
  $('incogNote').hidden = !data.incognito;
  applyTheme(data.theme);
  const tiles = data.shortcuts.map((s, i) => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = s.url;
    a.title = s.title + '\n' + s.url;
    a.draggable = true;
    const ic = document.createElement('div'); ic.className = 'ic';
    if (s.icon) {
      const im = document.createElement('img'); im.src = s.icon; im.alt = '';
      im.onerror = () => ic.replaceChildren(letterFor(s));
      ic.appendChild(im);
    } else ic.appendChild(letterFor(s));
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = s.title;
    const tools = document.createElement('div'); tools.className = 'tools';
    const be = document.createElement('button'); be.innerHTML = SVG.edit; be.title = 'Düzenle';
    be.onclick = (e) => { e.preventDefault(); openModal(i); };
    const bd = document.createElement('button'); bd.innerHTML = SVG.del; bd.title = 'Kaldır';
    bd.onclick = (e) => { e.preventDefault(); api && api.call('remove', i); };
    tools.append(be, bd);
    a.append(ic, nm, tools);
    a.addEventListener('dragstart', () => { dragFrom = i; a.classList.add('drag'); });
    a.addEventListener('dragend', () => a.classList.remove('drag'));
    a.addEventListener('dragover', (e) => e.preventDefault());
    a.addEventListener('drop', (e) => { e.preventDefault(); if (dragFrom >= 0 && dragFrom !== i && api) api.call('move', { from: dragFrom, to: i }); dragFrom = -1; });
    return a;
  });
  if (api && data.shortcuts.length < MAX) {
    const add = document.createElement('a');
    add.className = 'tile'; add.href = '#'; add.title = 'Kısayol ekle';
    add.innerHTML = `<div class="ic"><span class="plus">${SVG.plus}</span></div><div class="name">Kısayol ekle</div>`;
    add.onclick = (e) => { e.preventDefault(); openModal(-1); };
    tiles.push(add);
  }
  $('tiles').replaceChildren(...tiles);
}

// ---------- Add / edit dialog
let editing = -1;
function openModal(i) {
  editing = i;
  const s = data.shortcuts[i];
  $('mt').textContent = s ? 'Kısayolu düzenle' : 'Kısayol ekle';
  $('mn').value = s ? s.title : '';
  $('mu').value = s ? s.url : '';
  $('me').textContent = '';
  $('modal').hidden = false;
  (s ? $('mn') : $('mu')).focus();
}
function closeModal() { $('modal').hidden = true; }
async function saveModal() {
  if (!api) return;
  const r = await api.call(editing >= 0 ? 'edit' : 'add', { i: editing, title: $('mn').value, url: $('mu').value });
  if (r && r.error) { $('me').textContent = r.error; return; }
  closeModal();
}
$('mc').onclick = closeModal;
$('mok').onclick = saveModal;
$('modal').addEventListener('mousedown', (e) => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if ($('modal').hidden) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter') saveModal();
});

// ---------- Startup
if (api) {
  api.onUpdate((d) => { data = d; render(); });
  api.get().then((d) => { data = d; render(); }).catch(() => render());
} else render();
</script>
</body>
</html>
