<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline' file:"><title>Güvenlik uyarısı</title><script src="i18n.js"></script><style>:root{color-scheme:dark}body{margin:0;background:#161616;color:#eee;font:15px/1.6 "Segoe UI",sans-serif}main{max-width:640px;margin:14vh auto;padding:32px}h1{font-size:27px;font-weight:500;color:#ffb4ab}#host{font-weight:600;overflow-wrap:anywhere}p{color:#bbb}button{font:inherit;padding:10px 20px;border-radius:7px;cursor:pointer;border:1px solid #555;background:#292929;color:#eee}#back{background:#a8c7fa;color:#132a46;border:0}details{margin-top:28px}summary{cursor:pointer;color:#bbb}details button{margin-top:16px}</style></head><body><main><h1>Bu site güvenli olmayabilir</h1><div id="host"></div><p>Bu adres, bilinen zararlı veya yanıltıcı siteler listesinde bulunuyor. Sayfa açılmadan bağlantı durduruldu.</p><button id="back">Güvenli sayfaya dön</button><details><summary>Gelişmiş</summary><p>Adresin güvenli olduğundan eminseniz bu oturum için istisna oluşturabilirsiniz.</p><button id="continue">Riski kabul et ve devam et</button></details></main><script>const api=window.pageApi;api.get().then(d=>{document.getElementById('host').textContent=d.blockedHost||'Bağlantı engellendi';});document.getElementById('back').onclick=()=>api.call('security-back');document.getElementById('continue').onclick=()=>api.call('security-continue');</script></body></html>
