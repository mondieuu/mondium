# Builds and tests Mondium on Windows, Linux and macOS.
# A version tag (v1.2.3) also collects the installers into a draft GitHub release.
name: Build

on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            dist: npm run dist:win
          - name: linux-x64
            os: ubuntu-24.04
            dist: npm run dist:linux
          - name: mac-arm64
            os: macos-15
            dist: npm run dist:mac -- --arm64
          - name: mac-x64
            os: macos-15-intel
            dist: npm run dist:mac -- --x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make sure the Electron program is present
        run: node node_modules/electron/install.js
      - name: Unit tests
        run: |
          npm run test:security
          npm run test:platform
      - name: Build installers
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/smoke-test.cjs dist/win-unpacked/Mondium.exe
        env:
          SMOKE_OUT: smoke-shots/windows

      - name: Install Linux test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick libfuse2t64
      - name: Test the .deb package on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/Mondium-*-linux-*.deb
          xvfb-run -a -s "-screen 0 1280x820x24" node tools/smoke-test.cjs /opt/Mondium/mondium
        env:
          SMOKE_OUT: smoke-shots/linux-deb
      - name: Test the AppImage on Linux
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          chmod +x dist/Mondium-*-linux-*.AppImage
          xvfb-run -a -s "-screen 0 1280x820x24" node tools/smoke-test.cjs "$(ls dist/Mondium-*-linux-*.AppImage)"
        env:
          SMOKE_OUT: smoke-shots/linux-appimage

      - name: Test the disk image on macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/Mondium-*-mac-*.dmg -nobrowse -mountpoint /tmp/mondium-dmg
          cp -R /tmp/mondium-dmg/Mondium.app /tmp/Mondium.app
          hdiutil detach /tmp/mondium-dmg
          codesign --verify --deep --strict /tmp/Mondium.app
          node tools/smoke-test.cjs /tmp/Mondium.app/Contents/MacOS/Mondium
        env:
          SMOKE_OUT: smoke-shots/${{ matrix.name }}

      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots-${{ matrix.name }}
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/Mondium-Setup-*.exe
            dist/Mondium-*-linux-*.deb
            dist/Mondium-*-linux-*.AppImage
            dist/Mondium-*-mac-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          test "$(ls installers | wc -l)" -eq 5
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Mondium ${GITHUB_REF_NAME#v}" --notes "Draft: release notes are added before publishing."
