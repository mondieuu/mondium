# Temporary: finds out why the restarted Mondium dies.
name: Build
on:
  push:
    branches: ['release/**']
permissions:
  contents: read
jobs:
  exp:
    name: exp-restrict${{ matrix.restrict }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        restrict: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the published 1.6.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.6.4 --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir deb
          sudo apt-get update
          sudo apt-get install -y xvfb strace ./deb/*.deb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=${{ matrix.restrict }}
      - name: Experiment
        run: |
          Xvfb :99 -screen 0 1280x820x24 &
          sleep 1
          bash tools/nnp-exp.sh
